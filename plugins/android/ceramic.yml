plugin:
    name: Android
    tools: tools.AndroidPlugin

    runtime:
        if android:
            # Http support code is only bound if the http plugin is enabled
            if plugin_http:
                +java:
                    - '{plugin:cwd}/support/ceramic/src/main/java/ceramic/support/Http.java'
                    - '{plugin:cwd}/support/ceramic/src/main/java/ceramic/support/http/HttpRequest.java'
                +bind:
                    - '{plugin:cwd}/support/ceramic/src/main/java/ceramic/support/Http.java'
            +hooks:
                - when: begin build
                  command: ceramic
                  args: ['android', 'bind']
