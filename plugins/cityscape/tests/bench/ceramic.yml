app:
    package: mycompany.cityscapebench
    name: bench
    displayName: bench
    author: My Company
    version: '1.0'

    # Cityscape needs Glaze: a project lists both plugins (see the plugin's
    # ceramic.yml).
    plugins:
        - glaze
        - cityscape

    # Cityscape's sources, added directly until the Ceramic tools are rebuilt
    # with the cityscape plugin (see tests/unit/ceramic.yml).
    paths:
        - ../../runtime/src

    defines:
        # Native bench runs use a hidden SDL window (no window on screen)
        - clay_sdl_headless

    # `ceramic clay build mac --variant perf`: release build without the hxcpp
    # pointer checks, safe mode and stack bookkeeping that Ceramic adds for
    # crash dumps, for timings (diagnostic: the default build is the one whose
    # numbers count)
    if perf:
        +defines:
            - ceramic_no_hxcpp_checks

    # `--variant prof`: the perf build with its symbols kept, for profilers
    # (Instruments, sample)
    if prof:
        +defines:
            - ceramic_no_hxcpp_checks
            - HXCPP_DEBUG_LINK

    # `--variant prof_checked`: the default build (hxcpp checks on, the one
    # that counts) with its symbols kept, to see where the checks cost
    if prof_checked:
        +defines:
            - HXCPP_DEBUG_LINK

    # `--variant allocprof`: the default build with hxcpp's telemetry, which
    # records every allocation with its type, size and call stack; the bench
    # writes the allocation sites of each measured block (`AllocProfile`,
    # `<scenario>-cpp-allocs.txt` in the results folder). Diagnostic only:
    # slow. Without the concurrent collector (hxcpp's telemetry reads the
    # stack context of the collecting thread, which its marking thread has
    # not).
    if allocprof:
        +defines:
            - HXCPP_TELEMETRY
            - ceramic_no_concurrent_gc
