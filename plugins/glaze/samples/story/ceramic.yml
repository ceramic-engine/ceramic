app:
    package: glaze.story
    name: story
    displayName: GPUI Component
    author: gpui
    version: '1.0'

    plugins:
        # Glaze, the GPUI port with the gpui-kit components (built-in plugin)
        - glaze
        # Cityscape, Glaze's code editor (built-in plugin): the Editor story
        - cityscape
        # HTTP client: img() loads http(s) images through CeramicHttpClient
        - http
        # Native file dialogs: cx.promptForNewPath (CSV export of the data table)
        - dialogs
        # System notifications: the notification story's system delivery
        - notifications
        # Ceramic views: the "Ceramic visuals" story hosts measured views
        - ui

    # The story gallery (shared with test/golden, which renders every story)
    paths:
        - shared
