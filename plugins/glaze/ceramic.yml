plugin:
    name: Glaze
    tools: tools.GlazePlugin

    runtime:
        if plugin_glaze:
            +libs:
                - taffy
                - plutovg
                - ttf
                - lunasvg
                - ropey
                - unicode-segmentation
                - unicode-linebreak
                - markdown
                - html5ever
                - oniguruma
                - textmate
                - similar
            +paths:
                - '{plugin:cwd}/runtime/src'
            +assets:
                - '{plugin:cwd}/assets'

            # Optional: when the app also lists Ceramic's `http` plugin (define
            # plugin_http, set by Ceramic), img() loads http(s) Uri images
            # through glaze.CeramicHttpClient. Without it, the app keeps GPUI's
            # NullHttpClient and such images fail into their fallback.

            # Unity imports images as (premultiplied) textures; the port
            # decodes image files itself, so it needs their exact bytes too
            if unity:
                +defines:
                    - unity_raw_image_bytes

            # Opt-in: Noto Color Emoji shipped with the app as the first
            # emoji font of the text system, on every target (define
            # glaze_bundled_emoji; see resources/emoji-font/README.md). Without the
            # define, nothing of it is shipped.
            if glaze_bundled_emoji:
                +assets:
                    - '{plugin:cwd}/resources/emoji-font/assets'

            # Opt-in: vscode-oniguruma's onig.wasm as the code highlighter's
            # regex engine on the web (define glaze_onig_wasm). The hook copies
            # onig.wasm and its JavaScript binding from resources/onig-wasm/ into
            # project/web, or removes them when the define is not set.
            if web && glaze_onig_wasm:
                +hooks:
                    - when: begin build
                      command: ceramic
                      args: ['glaze', 'setup', 'onig-wasm']

            if web && !glaze_onig_wasm:
                +hooks:
                    - when: begin build
                      command: ceramic
                      args: ['glaze', 'setup', 'onig-wasm', '--remove']

        if !plugin_glaze:

            if web:
                +hooks:
                    - when: begin build
                      command: ceramic
                      args: ['glaze', 'setup', 'onig-wasm', '--remove']
