plugin:
    name: Clay
    tools: tools.ClayPlugin

    runtime:
        if clay:
            # +assets:
            #     - '{plugin:cwd}/assets'
            if !no_gles_angle:
                if mac || ios || windows:
                    +defines:
                        - gles_angle
            # Batched + vectorized render path (SSE2/NEON with plain C++
            # fallback), enabled by default on native targets.
            # Opt out with `ceramic_no_simd`.
            if !ceramic_no_simd:
                if mac || ios || windows || linux || android:
                    +defines:
                        - ceramic_simd
