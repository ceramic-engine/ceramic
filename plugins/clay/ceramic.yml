plugin:
    name: Clay
    tools: tools.ClayPlugin

    runtime:
        if clay:
            # +assets:
            #     - '{plugin:cwd}/assets'
            if !no_gles_angle:
                if mac || ios || windows:
                    +defines:
                        - gles_angle
            # Batched render path, enabled by default. On native targets:
            # vectorized kernels (SSE2/NEON with plain C++ fallback). On web:
            # tight typed-array loops (bit-exact with the scalar path).
            # Opt out with `ceramic_no_simd`.
            if !ceramic_no_simd:
                if mac || ios || windows || linux || android || web:
                    +defines:
                        - ceramic_simd
            # Generational GC, enabled by default on native targets.
            # Opt out with `ceramic_no_generational_gc`.
            if !ceramic_no_generational_gc:
                if mac || ios || windows || linux || android:
                    +defines:
                        - HXCPP_GC_GENERATIONAL
            # Concurrent GC runs most of the marking on a dedicated thread to
            # shorten collection pauses on the main thread. It builds on top of
            # generational GC, so it is only enabled when generational is too.
            # Opt out with `ceramic_no_concurrent_gc`.
            # Note: both are force-disabled for cppia builds (see Tools.hx), as
            # they are not safe under the bytecode interpreter.
            if !ceramic_no_concurrent_gc:
                if !ceramic_no_generational_gc:
                    if mac || ios || windows || linux || android:
                        +defines:
                            - HXCPP_GC_CONCURRENT
