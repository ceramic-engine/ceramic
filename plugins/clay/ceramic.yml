plugin:
    name: Clay
    tools: tools.ClayPlugin

    runtime:
        if clay:
            # +assets:
            #     - '{plugin:cwd}/assets'
            if !no_gles_angle:
                if mac || ios || windows:
                    +defines:
                        - gles_angle
            # Batched render path, enabled by default. On native targets:
            # vectorized kernels (SSE2/NEON with plain C++ fallback). On web:
            # tight typed-array loops (bit-exact with the scalar path).
            # Opt out with `ceramic_no_simd`.
            if !ceramic_no_simd:
                if mac || ios || windows || linux || android || web:
                    +defines:
                        - ceramic_simd
            # Generational + concurrent GC, enabled by default on native
            # targets: most of the marking runs on a dedicated thread,
            # which shortens collection pauses on the main thread.
            # Opt out with `ceramic_no_concurrent_gc`.
            if !ceramic_no_concurrent_gc:
                if mac || ios || windows || linux || android:
                    +defines:
                        - HXCPP_GC_GENERATIONAL
                        - HXCPP_GC_CONCURRENT
