plugin:
    name: ImGui
    tools: tools.ImGuiPlugin

    runtime:
        if plugin_imgui:

            +libs:
                - imgui-hx
            +paths:
                - '{plugin:cwd}/runtime/src'

            # Batteries-included default font (Roboto-Medium) + CJK fallback
            # (Kosugi), bundled with the plugin. Only included when the project
            # does not provide its own `imgui_font`.
            if !imgui_font:
              +assets:
                  - '{plugin:cwd}/assets'

            if web:
              +hooks:
                  - when: begin build
                    command: ceramic
                    args: ['imgui', 'setup', 'web']

            if unity:
              +hooks:
                  - when: end build
                    command: ceramic
                    args: ['imgui', 'setup', 'unity', '--if-exists']

        if !plugin_imgui:

            if web:
              +hooks:
                  - when: begin build
                    command: ceramic
                    args: ['imgui', 'setup', 'web', '--remove']
